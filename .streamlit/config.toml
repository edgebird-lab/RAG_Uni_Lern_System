# Streamlit-Konfiguration fuer das RAG-Lernsystem
[browser]
# kein E-Mail-Prompt / keine Nutzungsstatistik-Abfrage beim Start
gatherUsageStats = false

[server]
port = 8501
headless = false
# groessere Uploads erlauben (PDFs)
maxUploadSize = 500
# statische Dateien (PWA-Manifest + Icons unter ragapp/ui/static/) ausliefern,
# damit das Handy die App "zum Home-Bildschirm hinzufuegen" kann
enableStaticServing = true

# Bewusst KEIN [theme]/base mehr gesetzt: das legte Streamlits eigenes,
# internes Theme (Farben fuer native Widgets) serverweit/GLOBAL auf "hell"
# fest - fuer JEDES Geraet, das sich verbindet, unabhaengig von dessen
# eigener OS-/Browser-Einstellung (Nutzer-Feedback: "Handy hat Darkmode,
# will aber Whitemode - ist gesperrt, richtet sich nach der globalen
# Einstellung"). Ohne "base" erkennt Streamlit selbst PRO BROWSER/GERAET
# (ueber prefers-color-scheme, genau wie unser eigener Umschalter unten)
# und macht die App wirklich pro Geraet unabhaengig hell/dunkel waehlbar -
# siehe ragapp/ui/_style.py (_theme_toggle_html) fuer den manuellen
# Umschalt-Knopf, der zusaetzlich (localStorage, ebenfalls pro Geraet) das
# eigene "rag-dark"-Stylesheet steuert.

[client]
# Kein "Deploy"-Button und kein Entwickler-Menue oben rechts (wirkt wie eine echte App)
toolbarMode = "minimal"
