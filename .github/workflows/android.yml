name: Android CI

# Baut die Android-App und fuehrt die JVM-Tests aus. Laeuft nur, wenn sich android/ aendert.

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM-Tests, Debug-Build und Lint (Instrumentierte Tests brauchen ein Gerät und laufen lokal)
        run: ./gradlew :core:test testDebugUnitTest assembleDebug lintDebug --console=plain
