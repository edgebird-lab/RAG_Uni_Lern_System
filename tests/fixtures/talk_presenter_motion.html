<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Presenter motion fixture</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #efe4d2; }
    section { width: 1280px; height: 720px; padding: 48px; box-sizing: border-box; }
    h1, h2 { color: #0e3d45; }
    li { color: #14233a; font-size: 28px; }
  </style>
</head>
<body>
  <section id="1" class="lead">
    <h1>Lernvortrag <strong>Testing</strong></h1>
  </section>
  <section id="2" class="accent">
    <h2>Merksatz</h2>
    <blockquote>Abrufen schlägt Nachlesen.</blockquote>
  </section>
  <section id="3" class="content">
    <h2>Kern</h2>
    <ul>
      <li>Der <strong>Testing-Effekt</strong> bleibt</li>
    </ul>
  </section>
</body>
</html>
